<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meeting Auth Preview</title>
    <link rel="stylesheet" href="./meeting-auth-preview.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="preview-toolbar">
        <div class="preview-caption">
          <strong>Meeting / Auth Preview</strong>
          <p>顶部按钮用于切换登录、登录后入口、预定会议、加入会议和密码弹窗状态。</p>
        </div>
        <div class="switch-group">
          <button class="preview-switch active" data-auth-target="login" type="button">登录</button>
          <button class="preview-switch" data-auth-target="home" type="button">登录后入口</button>
          <button class="preview-switch" data-auth-target="schedule" type="button">预定会议</button>
          <button class="preview-switch" data-auth-target="join" type="button">加入会议</button>
          <button class="preview-switch" data-auth-target="join-password" type="button">密码弹窗</button>
        </div>
      </section>

      <section class="auth-frame" data-auth-view="login">
        <section class="brand-stage">
          <div class="brand-copy">
            <h1 class="wordmark"><span>meeting</span></h1>
          </div>
        </section>

        <aside class="auth-panel">
          <section class="auth-card" data-view="login">
            <div class="login-header-copy">
              <div class="login-mode-title">邮箱验证码登录</div>
              <button class="login-switch-link" type="button">使用密码登录 &gt;</button>
            </div>
            <form class="form-grid login-form">
              <input type="email" placeholder="请输入邮箱" value="" aria-label="邮箱" />
              <div class="field-shell">
                <input type="password" placeholder="请输入密码" value="" aria-label="密码" />
                <button class="field-inline-action" type="button">获取临时验证码</button>
              </div>
            </form>
            <div class="login-footer">
              <button type="button">忘记密码</button>
            </div>
            <div class="button-stack login-actions">
              <button class="button primary" data-auth-target="home" type="button">登录</button>
              <button class="button secondary wechat-button" type="button">
                <svg class="wechat-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <circle cx="9" cy="10" r="6.5" fill="#09b83e" />
                  <circle cx="15.2" cy="13.6" r="5.4" fill="#09b83e" />
                  <circle cx="7.3" cy="9.7" r="0.9" fill="#ffffff" />
                  <circle cx="10.4" cy="9.7" r="0.9" fill="#ffffff" />
                  <circle cx="13.8" cy="13.2" r="0.75" fill="#ffffff" />
                  <circle cx="16.6" cy="13.2" r="0.75" fill="#ffffff" />
                  <path d="M8.3 14.2 7.1 15.4v-1.7" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" />
                </svg>
              </button>
            </div>
            <div class="auth-divider" aria-hidden="true"></div>
            <button class="button secondary join-button" data-auth-target="join" type="button">加入会议</button>
          </section>

          <section class="auth-card" data-view="home">
            <div class="login-header-copy">
              <div class="login-mode-title">快速会议 / 预定会议</div>
              <button class="login-switch-link" data-auth-target="login" type="button">返回登录 &gt;</button>
            </div>
            <div class="quick-list">
              <article class="quick-card">
                <strong>快速会议</strong>
                <a class="action-link primary" href="./meeting-room-preview.html">快速会议</a>
              </article>
              <article class="quick-card">
                <strong>预定会议</strong>
                <button class="button secondary" data-auth-target="schedule" type="button">预定会议</button>
              </article>
            </div>
            <button class="button ghost" data-auth-target="join" type="button">已有会议号？加入会议</button>
          </section>

          <section class="auth-card" data-view="schedule">
            <div>
              <div class="eyebrow">Schedule meeting</div>
              <h2>预定会议</h2>
            </div>
            <form class="form-grid">
              <label>
                会议主题
                <input value="全球产品评审会" />
              </label>
              <label>
                会议时间
                <input type="datetime-local" value="2026-03-28T19:30" />
              </label>
              <label>
                时区
                <select>
                  <option>Asia/Shanghai (UTC+08:00)</option>
                  <option>UTC</option>
                  <option>America/Los_Angeles (UTC-07:00)</option>
                </select>
              </label>
              <label>
                会议密码（可选）
                <input placeholder="留空则不开启会议密码" value="stage2026" />
              </label>
            </form>
            <div class="button-row">
              <button class="button primary" type="button">预定会议</button>
              <button class="button ghost" data-auth-target="home" type="button">返回</button>
            </div>
          </section>

          <section class="auth-card" data-view="join">
            <div>
              <div class="eyebrow">Join meeting</div>
              <h2>加入会议</h2>
            </div>
            <form class="form-grid">
              <label>
                会议号 / Meeting Code
                <input value="82C1F0" />
              </label>
              <label>
                昵称
                <input value="设计评审嘉宾" />
              </label>
            </form>
            <div class="button-row">
              <button class="button primary" data-auth-target="join-password" type="button">验证会议号</button>
              <button class="button ghost" data-auth-target="login" type="button">返回</button>
            </div>
          </section>

          <div class="join-password-modal">
            <div class="modal-card">
              <div class="meeting-badge">会议号 82C1F0 已确认</div>
              <div>
                <h3>请输入会议密码</h3>
              </div>
              <form class="form-grid">
                <label>
                  会议密码
                  <input type="password" value="••••••••" />
                </label>
              </form>
              <div class="button-row">
                <a class="action-link primary" href="./meeting-room-preview.html">加入并进入会议</a>
                <button class="button ghost" data-auth-target="join" type="button">返回</button>
              </div>
            </div>
          </div>

          <aside class="build-metadata" aria-label="版本信息">
            <span>version: 0.0.1</span>
            <span>commit: 9f4c3b2a1d6e</span>
            <span>build time: 2026-05-05 21:14:08 +08:00</span>
          </aside>
        </aside>
      </section>
    </main>

    <script>
      (() => {
        const frame = document.querySelector(".auth-frame");
        const switches = Array.from(document.querySelectorAll("[data-auth-target]"));
        const supportedViews = new Set(["login", "home", "schedule", "join", "join-password"]);

        if (!frame) {
          return;
        }

        function resolveView() {
          const hashView = window.location.hash.replace(/^#/, "");
          if (supportedViews.has(hashView)) {
            return hashView;
          }

          return frame.dataset.authView || "login";
        }

        function setView(nextView) {
          frame.dataset.authView = nextView;
          for (const button of switches) {
            button.classList.toggle("active", button.dataset.authTarget === nextView);
          }
        }

        for (const button of switches) {
          button.addEventListener("click", () => {
            const nextView = button.dataset.authTarget;
            if (!nextView) {
              return;
            }
            setView(nextView);
          });
        }

        window.addEventListener("hashchange", () => {
          setView(resolveView());
        });

        setView(resolveView());
      })();
    </script>
  </body>
</html>
